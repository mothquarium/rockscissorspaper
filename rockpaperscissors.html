<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="content">
        <h1>ROCK, PAPER, OR SCISSORS?</h1>
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
        <div id="results">
            <p>Score: <span id="player-score">0</span> - <span id="comp-score">0</span></p>
            <p>Rounds played: <span id="rounds-played">0</span></p>
            <strong id="winner"></strong>
            <p id="player-move"></p>
            <p id="computer-move"></p>
            <em id="win-lose"></em>
            <hr>
            <div id="scoreboard">
                <h2>Scoreboard</h2>
            </div>
        </div>
    </div>
    <script>
        let playerScore = 0;
        let compScore = 0;
        let playerMove = "none";
        let roundsPlayed = 0;
        const tieMsg = "IT'S A TIE!";
        const playerWinMsg = "YOU GET A POINT!";
        const compWinMsg = "COMPUTER GETS A POINT!";
        const rockBtn = document.querySelector('#rock');
        const paperBtn = document.querySelector('#paper');
        const scissorsBtn = document.querySelector('#scissors');
        const roundsPlayedTxt = document.querySelector('#rounds-played');
        const playerScoreTxt = document.querySelector('#player-score');
        const compScoreTxt = document.querySelector('#comp-score');
        

        rockBtn.addEventListener("click", () => {playerMove = "ROCK"; playRound();});
        paperBtn.addEventListener("click", () => {playerMove = "PAPER"; playRound();});
        scissorsBtn.addEventListener("click", () => {playerMove = "SCISSORS"; playRound();});
        

        function getComputerChoice() {
            //works, returns 0-2
            return Math.floor(Math.random() * 3);
        }

        function playRound() {
            /*these assignments dont feel good but i dont think id have a way to do it well w/o
            trying to pass objects in*/
            const playerMoveTxt = document.querySelector('#player-move');
            const computerMoveTxt = document.querySelector('#computer-move');
            const winLoseTxt = document.querySelector('#win-lose');
            const scoreboard = document.querySelector('#scoreboard')

            let compMove = getComputerChoice();
            playerMoveTxt.textContent = "You chose " + playerMove.toLowerCase() + ".";
            switch (compMove) {
                case 0:
                    computerMoveTxt.textContent = "Computer chooses rock.";
                    break;
                case 1:
                    computerMoveTxt.textContent = "Computer chooses paper.";
                    break;
                case 2:
                    computerMoveTxt.textContent = "Computer chooses scissors.";
                    break;
                default: 
                    console.log("game machine broke");
            }

            if ((playerMove == "ROCK" && compMove == 0) ||
                (playerMove == "PAPER" && compMove == 1) ||
                (playerMove == "SCISSORS" && compMove == 2)) {
                    winLoseTxt.textContent = tieMsg;
            }
            else if ((playerMove == "ROCK" && compMove == 2) ||
                     (playerMove == "PAPER" && compMove == 0) ||
                     (playerMove == "SCISSORS" && compMove == 1)) {
                        winLoseTxt.textContent = playerWinMsg;
                        playerScore++;
                     }
            else if ((playerMove == "ROCK" && compMove == 1) ||
                     (playerMove == "PAPER" && compMove == 2) ||
                     (playerMove == "SCISSORS" && compMove == 0)) {
                        winLoseTxt.textContent = compWinMsg;
                        compScore++;
                     }
            
            roundsPlayed++;
            roundsPlayedTxt.textContent = roundsPlayed;
            playerScoreTxt.textContent = playerScore;
            compScoreTxt.textContent = compScore;

            if (roundsPlayed % 5 === 0) {
                //make decision + append paragraph
                if (playerScore > compScore) {
                    const playerWinTxt = document.createElement('p');
                    scoreboard.appendChild(playerWinTxt);
                    playerWinTxt.textContent = "You won!";
                }
                else if (playerScore < compScore) {
                    const compWinTxt = document.createElement('p');
                    scoreboard.appendChild(compWinTxt);
                    compWinTxt.textContent = "Computer won!";
                }
                else if (playerScore === compScore) {
                    const noWinTxt = document.createElement('p');
                    scoreboard.appendChild(noWinTxt);
                    noWinTxt.textContent = "You tied.";
                }
            }
        }
    </script>
</body>
</html>
